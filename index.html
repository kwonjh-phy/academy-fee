<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b58"><meta name="apple-mobile-web-app-capable" content="yes"><title>우리 아이 학원비 관리</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#172b29;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:22px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;margin:0}small,.muted{color:#657773}.card{background:white;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 2px 12px #143b2b0b}.month{display:flex;align-items:center;justify-content:space-between}.month strong{font-size:19px}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:650;cursor:pointer;background:#176b58;color:white}button.secondary{background:#e8f0ed;color:#205d50}button.danger{background:#fae9e8;color:#a52f2f}button:focus-visible,input:focus-visible{outline:3px solid #76bbaa}button:disabled{opacity:.45}.summary{background:#176b58;color:white}.summary small{color:#d0ebe3}.sum{font-size:29px;font-weight:800;margin:9px 0}.track{height:9px;background:#ffffff55;border-radius:9px;overflow:hidden}.fill{height:100%;background:#a5ebcd;width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.academy{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #edf1ef;padding:16px 0}.academy:last-child{border-bottom:0}.academy h3{margin:0 0 4px;font-size:17px}.academy p{margin:3px 0;font-size:13px;color:#657773}.status{font-weight:700;font-size:13px;color:#ba483b}.status.ok{color:#178362}.check{width:29px;height:29px;accent-color:#176b58;cursor:pointer}.actions{display:flex;gap:6px;margin-top:8px}.actions button{padding:6px 10px;font-size:12px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input{width:100%;border:1px solid #cbd8d2;border-radius:11px;padding:12px;font:inherit;background:white}dialog{border:0;border-radius:20px;padding:20px;width:min(94vw,460px);box-shadow:0 12px 50px #0003}dialog::backdrop{background:#0006}dialog h2{margin-top:0}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.empty{text-align:center;padding:25px 0;color:#667}.footnote{font-size:12px;color:#667773;line-height:1.6}.install{display:none;margin-top:12px;width:100%}.badge{background:#e4f3ed;color:#176b58;padding:4px 8px;border-radius:20px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{font-size:12px}.hidden{display:none!important}
</style></head><body><main><header><div><h1>🎒 우리 아이 학원비</h1><small>월별 납부 관리 · 내 휴대폰에 저장</small></div><button class="secondary" id="add">＋ 학원</button></header><button id="install" class="install">홈 화면에 앱 설치</button><section class="card month"><button class="secondary" id="prev" aria-label="이전 달">◀</button><strong id="month"></strong><button class="secondary" id="next" aria-label="다음 달">▶</button></section><section class="card summary"><small>이번 달 납부한 금액</small><div class="sum" id="paidSum">0원</div><div class="track"><div class="fill" id="fill"></div></div><p class="row"><small id="counts"></small><small id="total"></small></p></section><section class="card"><div class="row"><h2 style="font-size:18px;margin:0">학원별 납부 현황</h2><span class="badge" id="unpaid"></span></div><div id="list"></div></section><section class="card"><h2 style="font-size:17px;margin-top:0">기록 백업 및 복원</h2><p class="footnote">데이터는 이 기기의 브라우저에만 저장됩니다. 브라우저 데이터 삭제·기기 교체 시 기록이 사라질 수 있으므로 정기적으로 백업해 주세요.</p><div class="toolbar"><button class="secondary" id="export">백업 파일 저장</button><button class="secondary" id="importBtn">백업 복원</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div></section><p class="footnote">납부 체크 시 오늘 날짜가 기록됩니다. 지난달의 체크 상태는 그대로 유지됩니다. 학원비 변경은 해당 월부터 적용됩니다.</p></main><dialog id="editor"><form id="form"><h2 id="formTitle">학원 추가</h2><label for="name">학원 이름</label><input id="name" required maxlength="60" placeholder="예: 수학학원"><label for="fee">월 학원비 (원)</label><input id="fee" type="number" min="0" max="100000000" step="1" required placeholder="250000"><label for="day">납부 예정일 (1~31일)</label><input id="day" type="number" min="1" max="31" required value="10"><div class="dialog-actions"><button type="button" class="secondary" id="cancel">취소</button><button type="submit">저장</button></div></form></dialog><script>
(()=>{'use strict';const KEY='academy-fees-v1';const $=id=>document.getElementById(id);const today=new Date();let year=today.getFullYear(),month=today.getMonth()+1,editing=null,installPrompt=null;const ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;const nowMonth=()=>ym(year,month);const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';const clean=s=>String(s||'').trim();function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.academies)&&typeof x.payments==='object'&&x.payments&&typeof x.rates==='object'&&x.rates)return x}catch(e){}return {academies:[],payments:{},rates:{}}}let data=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 공간이 부족하거나 저장이 차단되었습니다. 브라우저 설정을 확인해 주세요.')}}function feeAt(a,k){const rates=data.rates[a.id]||{};const months=Object.keys(rates).filter(v=>/^\d{4}-\d{2}$/.test(v)&&v<=k).sort();return months.length?Number(rates[months[months.length-1]]):Number(a.fee||0)}function active(a,k){return a.start<=k&&(!a.end||k<a.end)}function render(){const k=nowMonth();$('month').textContent=`${year}년 ${month}월`;const items=data.academies.filter(a=>active(a,k));let total=0,paid=0,done=0;const root=$('list');root.replaceChildren();items.forEach(a=>{const fee=feeAt(a,k),p=data.payments[k]?.[a.id];total+=fee;if(p){paid+=fee;done++}const row=document.createElement('div');row.className='academy';const left=document.createElement('div');left.style.flex='1';const h=document.createElement('h3');h.textContent=a.name;const detail=document.createElement('p');detail.textContent=`${money(fee)} · 매월 ${a.day}일`;const status=document.createElement('div');status.className='status'+(p?' ok':'');status.textContent=p?`납부 완료 · ${p.date||'날짜 미기록'}`:'미납';const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='수정';edit.onclick=()=>openEditor(a);const del=document.createElement('button');del.className='danger';del.textContent='등록 종료';del.onclick=()=>{if(confirm(`${a.name}을(를) ${k}부터 목록에서 제외할까요? 과거 납부 기록은 유지됩니다.`)){a.end=k;save();render()}};actions.append(edit,del);left.append(h,detail,status,actions);const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=!!p;cb.setAttribute('aria-label',`${a.name} 납부 여부`);cb.onchange=()=>{data.payments[k]??={};if(cb.checked)data.payments[k][a.id]={date:new Date().toLocaleDateString('sv-SE')};else delete data.payments[k][a.id];save();render()};row.append(left,cb);root.append(row)});if(!items.length){const e=document.createElement('p');e.className='empty';e.textContent='등록된 학원이 없습니다. ＋ 학원을 눌러 추가하세요.';root.append(e)}$('paidSum').textContent=money(paid);$('total').textContent=`전체 ${money(total)}`;$('counts').textContent=`납부 ${done}건 / 총 ${items.length}건`;$('unpaid').textContent=`미납 ${items.length-done}건`;$('fill').style.width=(total?Math.min(100,paid/total*100):0)+'%'}function openEditor(a){editing=a?a.id:null;$('formTitle').textContent=a?'학원 정보 수정':'학원 추가';$('name').value=a?a.name:'';$('fee').value=a?feeAt(a,nowMonth()):'';$('day').value=a?a.day:10;$('editor').showModal()}$('add').onclick=()=>openEditor(null);$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const name=clean($('name').value),fee=Number($('fee').value),day=Number($('day').value);if(!name||!Number.isSafeInteger(fee)||fee<0||fee>100000000||!Number.isInteger(day)||day<1||day>31)return alert('입력값을 확인해 주세요.');const k=nowMonth();if(editing){const a=data.academies.find(x=>x.id===editing);if(!a)return;a.name=name;a.day=day;data.rates[a.id]??={};data.rates[a.id][k]=fee}else{const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();data.academies.push({id,name,fee,day,start:k,end:null});data.rates[id]={[k]:fee}}save();$('editor').close();render()};function move(delta){month+=delta;if(month<1){month=12;year--}if(month>12){month=1;year++}render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`학원비-백업-${new Date().toLocaleDateString('sv-SE')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5e6)throw Error('파일이 너무 큽니다.');const x=JSON.parse(await f.text()),d=x.data;if(x.version!==1||!d||!Array.isArray(d.academies)||!d.payments||typeof d.payments!=='object'||Array.isArray(d.payments)||!d.rates||typeof d.rates!=='object'||Array.isArray(d.rates)||!d.academies.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&typeof a.start==='string'))throw Error('올바른 백업 파일이 아닙니다.');if(confirm('현재 저장된 데이터를 백업 파일의 데이터로 교체할까요?')){data=d;save();render()}}catch(err){alert('복원 실패: '+err.message)}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').style.display='block'});$('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').style.display='none'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render()})();
</script></body></html>
